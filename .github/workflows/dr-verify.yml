name: Weekly Disaster Recovery Verification

on:
  schedule:
    # Run every Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-restore:
    name: Verify Backup & Restore
    runs-on: ubuntu-latest

    services:
      scratch-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scratch_user
          POSTGRES_PASSWORD: scratch_password
          POSTGRES_DB: scratch_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install PostgreSQL Client & AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client awscli

      - name: Run Disaster Recovery Verification
        id: dr_run
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'media' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
          SCRATCH_DATABASE_URL: postgres://scratch_user:scratch_password@localhost:5432/scratch_db
        run: |
          chmod +x ./scripts/verify-restore.sh
          ./scripts/verify-restore.sh

      - name: Open Issue on DR Verification Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Disaster Recovery Verification Failed: ${new Date().toISOString().split('T')[0]}`,
              body: `The automated weekly disaster recovery restore test failed.\n\n**Run Details:** [View Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n**Action Required:** Inspect the R2 backup archive, database schema migration drift, or RLS policy constraints immediately.`,
              labels: ['security', 'disaster-recovery', 'critical']
            });
