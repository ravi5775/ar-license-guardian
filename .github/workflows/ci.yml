name: CI Quality Gate (All Branches & PRs)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run ESLint
        run: bun run lint
      - name: Run TypeScript Typecheck
        run: bun run typecheck

  test-matrix:
    name: Test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: admin
            RUNTIME: edge
            DB_DRIVER: neon
            RATELIMIT_DRIVER: postgres
            LICENCE_ROLE: issuer
          - profile: selfhost
            RUNTIME: node
            DB_DRIVER: postgres
            RATELIMIT_DRIVER: postgres
            LICENCE_ROLE: issuer
          - profile: client
            RUNTIME: edge
            DB_DRIVER: none
            RATELIMIT_DRIVER: memory
            LICENCE_ROLE: client
    env:
      RUNTIME: ${{ matrix.RUNTIME }}
      DB_DRIVER: ${{ matrix.DB_DRIVER }}
      RATELIMIT_DRIVER: ${{ matrix.RATELIMIT_DRIVER }}
      LICENCE_ROLE: ${{ matrix.LICENCE_ROLE }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Profile
        run: bun run build:${{ matrix.profile }}
      - name: Unit & Security Tests
        run: bun test tests/api-contract.test.ts tests/dto-sanitizer.test.ts tests/env-and-adapters.test.ts tests/rate-limiter.test.ts tests/security-critical-fixes.test.ts tests/security-headers.test.ts tests/upload-security.test.ts tests/comprehensive-security-regression.test.ts

  rls-integration-tests:
    name: RLS Integration Tests
    runs-on: ubuntu-latest
    if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Supabase RLS Tests
        run: bunx vitest run tests/rls-regression.test.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Tests with Coverage
        run: bun test --coverage
      - name: Upload Coverage Summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            coverage/
          if-no-files-found: ignore

  quality-gate:
    name: CI Quality Gate Final Result
    needs: [lint-and-typecheck, test-matrix]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Quality Gate
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "::error::CI Quality Gate failed! Deployments are blocked."
            exit 1
          fi
          echo "All CI Quality Gates passed successfully."
