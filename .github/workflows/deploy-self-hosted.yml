name: Build self-hosted image (GHCR)

on:
  push:
    branches: [self-hosted]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/self-hosted/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:self-hosted
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      # Coolify pulls from GHCR on push — a client deploy is one webhook.
      - name: Trigger Coolify
        if: ${{ secrets.COOLIFY_WEBHOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.COOLIFY_WEBHOOK }}"
